name: Scrape & deploy

on:
  schedule:
    - cron: '7,37 * * * *' # every 30 min (UTC; GitHub may delay scheduled runs a bit)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test
        run: npm test

      - id: pages
        uses: actions/configure-pages@v5

      - name: Scrape NOL + Melon and push new openings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/scrape.mjs

      - name: Commit data (only when items/state actually changed)
        run: |
          git add -A public/data data
          if git diff --cached --quiet -I '"(updatedAt|checkedAt)"'; then
            echo "No meaningful data change"
            git reset -q
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "data: update $(date -u +%FT%TZ)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
